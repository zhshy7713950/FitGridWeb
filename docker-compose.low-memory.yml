services:
  db:
    mem_limit: 512m
    cpus: 0.75
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=30
      - -c
      - max_wal_size=512MB

  app:
    mem_limit: 640m
    cpus: 1.0
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is required}:3000"
    environment:
      APP_BASE_PATH: /fitgrid
      BETTER_AUTH_URL: "https://${DOMAIN:?DOMAIN is required}${PUBLIC_PORT_SUFFIX:-}/fitgrid"
      NODE_OPTIONS: --max-old-space-size=512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/fitgrid/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
