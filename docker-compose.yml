services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?APP_DATABASE_USER is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [backend]

  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    group_add:
      - ${PORTABLE_BACKUP_READER_GID:-1001}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      OWNER_REF_SECRET: ${OWNER_REF_SECRET:?OWNER_REF_SECRET is required}
      CURSOR_SIGNING_SECRET: ${CURSOR_SIGNING_SECRET:-${BETTER_AUTH_SECRET}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ADMIN_OPS_DIR: /var/lib/fitgridweb/admin-ops
      PORTABLE_BACKUP_DIR: /var/lib/fitgridweb/portable-backups
      PORTABLE_BACKUP_HISTORY_FILE: /var/lib/fitgridweb/admin-ops/status/backups.json
      PORTABLE_BACKUP_MAX_BYTES: ${PORTABLE_BACKUP_MAX_BYTES:?PORTABLE_BACKUP_MAX_BYTES is required}
    volumes:
      - ${ADMIN_OPS_WEB_DIR:?ADMIN_OPS_WEB_DIR is required}:/var/lib/fitgridweb/admin-ops:rw
      - ${PORTABLE_BACKUP_DIR:?PORTABLE_BACKUP_DIR is required}:/var/lib/fitgridweb/portable-backups:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [backend]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
    internal: false

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
