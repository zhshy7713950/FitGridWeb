name: Server image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: zhshy7713950/fitgridweb

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fitgridweb_test
          POSTGRES_USER: fitgrid_ci
          POSTGRES_PASSWORD: fitgrid_ci_local
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U fitgrid_ci -d fitgridweb_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_BASE_PATH: /fitgrid
      DATABASE_URL: postgresql://fitgrid_app_ci:fitgrid_app_ci_local@localhost:5432/fitgridweb_test
      MIGRATION_DATABASE_URL: postgresql://fitgrid_ci:fitgrid_ci_local@localhost:5432/fitgridweb_test
      TEST_DATABASE_URL: postgresql://fitgrid_app_ci:fitgrid_app_ci_local@localhost:5432/fitgridweb_test
      CURSOR_SIGNING_SECRET: fitgrid-ci-cursor-signing-secret-2026
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure restricted runtime database role
        run: |
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPASSWORD=fitgrid_ci_local \
            -e POSTGRES_DB=fitgridweb_test \
            -e POSTGRES_USER=fitgrid_ci \
            -e APP_DATABASE_USER=fitgrid_app_ci \
            -e APP_DATABASE_PASSWORD=fitgrid_app_ci_local \
            -v "$PWD/docker/postgres/init-app-role.sh:/init-app-role.sh:ro" \
            postgres:17-alpine sh /init-app-role.sh
      - run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.MIGRATION_DATABASE_URL }}
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  image:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          build-args: |
            NEXT_BASE_PATH=/fitgrid
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify runtime CLIs without Corepack writes
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            -e DATABASE_URL=file:/tmp/cli-check.db \
            --entrypoint /app/node_modules/.bin/prisma "$IMAGE" --version
          docker run --rm --read-only --tmpfs /tmp:size=64m \
            --entrypoint /app/node_modules/.bin/tsx "$IMAGE" --version
