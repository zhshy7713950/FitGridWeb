openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FitGridWeb API
  version: 1.0.0
  description: >-
    FitGridWeb 网格交易 API。所有产品接口自动限定为当前登录账号；API 不接受或返回 ownerId。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: System
    description: 服务存活与就绪检查
  - name: Auth
    description: 登录、会话与密码管理
  - name: Invitations
    description: 私有一次性邀请
  - name: Admin
    description: 账号、邀请和禁用状态管理，不读取用户产品
  - name: GridTrades
    description: 当前登录账号的网格产品与权威计算
  - name: ImportExport
    description: 当前登录账号的数据导入、兼容导出与完整备份

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 检查服务是否就绪
      security: []
      responses:
        '200':
          description: 应用和数据库就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用用户名和密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并设置安全会话 Cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前会话
      responses:
        '204': {description: 当前会话已撤销}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 获取当前会话
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 修改当前账号密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': {description: 密码已更新，其他会话已撤销}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitations]
      operationId: getInvitationStatus
      summary: 查询邀请是否可用
      security: []
      responses:
        '200':
          description: 邀请状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: 接受邀请并创建账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: 用户已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/invitations:
    post:
      tags: [Admin, Invitations]
      operationId: createInvitation
      summary: 创建一次性邀请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 邀请已创建；明文 token 只返回一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: 列出账号及状态
      description: 只返回账号与状态，不返回产品数量或产品数据。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin]
      operationId: updateUserStatus
      summary: 启用或禁用账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/UserStatus'}
      responses:
        '200':
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/backups:
    get:
      tags: [Admin, ImportExport]
      operationId: listPortableBackups
      summary: 列出最近五份可下载的完整备份
      responses:
        '200':
          description: 按创建时间倒序排列的成功备份，最多五份
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortableBackupList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Admin, ImportExport]
      operationId: createPortableBackup
      summary: 重新验证管理员并创建完整便携备份
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePortableBackupRequest'}
      responses:
        '202':
          description: 备份任务已进入主机维护队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/backups/{backupId}/download-token:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Admin, ImportExport]
      operationId: issuePortableBackupDownloadToken
      summary: 为一份备份发放绑定管理员的单次下载令牌
      responses:
        '201':
          description: 令牌已发放，60 秒后失效
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/backups/{backupId}/download:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    get:
      tags: [Admin, ImportExport]
      operationId: downloadPortableBackup
      summary: 使用单次令牌流式下载完整便携备份
      description: 不支持 Range；令牌在打开备份文件前被原子消费，下载中断不会删除服务器副本。
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '200':
          description: 加密的便携备份流
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            Content-Disposition:
              description: 固定格式安全文件名的附件响应
              schema: {type: string}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
            Accept-Ranges:
              schema: {type: string, const: none}
          content:
            application/vnd.fitgrid.backup:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416':
          description: RANGE_NOT_SUPPORTED：完整备份不支持分段下载
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/restores/uploads:
    post:
      tags: [Admin, ImportExport]
      operationId: uploadPortableBackupForInspection
      summary: 流式上传完整备份并创建隔离预检任务
      description: 请求正文直接流式落盘；不使用 multipart/form-data，也不会整体读入 JavaScript 内存。
      parameters:
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            pattern: '^fitgridweb-[0-9]{8}T[0-9]{6}Z\.fitgridbackup$'
        - name: X-FitGrid-Backup-Passphrase
          in: header
          required: true
          description: 只在当前 HTTPS 请求内存和受限任务秘密文件中短暂存在
          schema: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        - name: X-FitGrid-Backup-Size
          in: header
          required: true
          description: 声明的正文大小；部署通过 PORTABLE_BACKUP_MAX_BYTES 配置上限，默认 512 MiB，应用仍会独立统计实际字节数
          schema: {type: integer, minimum: 1, default: 536870912}
      requestBody:
        required: true
        content:
          application/vnd.fitgrid.backup:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: 上传已完整落盘，预检任务已进入队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: BACKUP_MEDIA_TYPE_INVALID：必须使用完整备份媒体类型
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/restores/{restoreId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RestoreId'
    post:
      tags: [Admin, ImportExport]
      operationId: confirmPortableBackupRestore
      summary: 重新验证管理员并确认整库恢复
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRestoreRequest'}
      responses:
        '202':
          description: 绑定预检结果的恢复任务已进入队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/maintenance/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/MaintenanceJobId'
    get:
      tags: [Admin]
      operationId: getMaintenanceJob
      summary: 获取安全裁剪后的维护任务状态
      description: 恢复期间仍可读取；响应不包含宿主机路径、命令、密码或数据库连接信息。
      responses:
        '200':
          description: 当前任务阶段和安全结果
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceJobStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /grid-trades:
    get:
      tags: [GridTrades]
      operationId: listGridTrades
      summary: 搜索和分页列出自己的产品
      description: 仅查询当前会话 ownerId 的产品。
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
          description: 产品名称或产品代码模糊搜索
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 当前账号产品页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [GridTrades]
      operationId: createGridTrade
      summary: 创建自己的网格产品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridTradeCreateRequest'
      responses:
        '201':
          description: 产品已创建并计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /grid-trades/{id}:
    parameters:
      - $ref: '#/components/parameters/GridTradeId'
    get:
      tags: [GridTrades]
      operationId: getGridTrade
      summary: 获取自己的产品和计算结果
      description: 不存在或属于其他账号时均返回 404。
      responses:
        '200':
          description: 产品输入与权威计算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [GridTrades]
      operationId: updateGridTrade
      summary: 更新自己的产品并重算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridTradeUpdateRequest'
      responses:
        '200':
          description: 产品已更新并重算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [GridTrades]
      operationId: deleteGridTrade
      summary: 删除自己的产品
      responses:
        '204': {description: 产品已删除}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /grid-trades/{id}/recalculate:
    parameters:
      - $ref: '#/components/parameters/GridTradeId'
    post:
      tags: [GridTrades]
      operationId: recalculateGridTrade
      summary: 重新计算自己的产品
      responses:
        '200':
          description: 使用记录保存的算法版本重新计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /grid-trades/import/preview:
    post:
      tags: [ImportExport]
      operationId: previewGridTradeImport
      summary: 预检 Android JSON 导入
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 当前账号范围内的导入预检
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grid-trades/import/commit:
    post:
      tags: [ImportExport]
      operationId: commitGridTradeImport
      summary: 按冲突策略提交导入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '200':
          description: 事务导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: IMPORT_PREVIEW_NOT_FOUND：导入预检不存在、已过期或已使用
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grid-trades/export:
    get:
      tags: [ImportExport]
      operationId: exportGridTrades
      summary: 导出自己的网格产品
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [android, web]
      responses:
        '200':
          description: 当前账号的下载文件
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: '#/components/schemas/AndroidGridTrade'}
                  - $ref: '#/components/schemas/WebBackup'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fitgridweb.session_token

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
      description: 服务端签名的不透明游标
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    GridTradeId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InvitationToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 512}
    BackupId:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9.][A-Za-z0-9._-]*$'
    RestoreId:
      name: restoreId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaintenanceJobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    PrivateNoStore:
      description: 响应不得由浏览器或中间缓存保存
      schema: {type: string, const: 'no-store, private'}
    NoSniff:
      description: 禁止浏览器内容类型嗅探
      schema: {type: string, const: nosniff}

  responses:
    BadRequest:
      description: 请求格式错误
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: 未认证或会话失效
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: 当前角色无权执行管理操作
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: 资源不存在；跨账号产品也使用本响应
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: 唯一性、版本或邀请状态冲突
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PayloadTooLarge:
      description: 文件或请求体超限
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationError:
      description: 字段或算法校验失败
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: 请求过快
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ServiceUnavailable:
      description: 服务未就绪
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    InternalError:
      description: 内部状态不可用；响应经过安全裁剪，不包含路径、命令或秘密
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}

  schemas:
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      examples: ['1.05', '2000', '0.1856']
    PositiveDecimalString:
      allOf:
        - $ref: '#/components/schemas/DecimalString'
      description: 解析后的十进制值必须大于 0
    UserRole:
      type: string
      enum: [member, admin]
    UserStatus:
      type: string
      enum: [active, disabled]
    AlgorithmVersion:
      type: string
      enum: [android-v2.1.0]
    GridType:
      type: integer
      enum: [1, 2, 3]
      description: 1 小网、2 中网、3 大网

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code: {type: string, pattern: '^[A-Z0-9_]+$'}
        message: {type: string}
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
        requestId: {type: string}

    CreatePortableBackupRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, backupPassword, confirmBackupPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        backupPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
        confirmBackupPassword: {type: string, minLength: 12, maxLength: 128, writeOnly: true}
    ConfirmRestoreRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, confirmationPhrase]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128, writeOnly: true}
        confirmationPhrase: {type: string, const: 恢复全部数据}
    MaintenanceState:
      type: string
      enum:
        - queued
        - dumping
        - encrypting
        - ready
        - uploading
        - inspecting
        - awaiting-confirmation
        - snapshotting
        - restoring
        - migrating
        - checking
        - succeeded
        - failed
        - rollback
        - intervention-required
    MaintenanceJobType:
      type: string
      enum: [backup, inspect-restore, restore]
    QueuedMaintenanceJob:
      type: object
      additionalProperties: false
      required: [id, type, state, requestId]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MaintenanceJobType'}
        state: {type: string, const: queued}
        requestId: {type: string}
    PortableBackupSummary:
      type: object
      additionalProperties: false
      required: [id, createdAt, size, sha256]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        createdAt: {type: string, format: date-time}
        size: {type: integer, minimum: 0}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
    PortableBackupList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 5
          items: {$ref: '#/components/schemas/PortableBackupSummary'}
    DownloadTokenResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: 绑定当前管理员和备份、60 秒有效且只能成功消费一次
    RestorePreview:
      type: object
      additionalProperties: false
      required: [users, gridTrades, invitations, importPreviews]
      properties:
        users: {type: integer, minimum: 0}
        gridTrades: {type: integer, minimum: 0}
        invitations: {type: integer, minimum: 0}
        importPreviews: {type: integer, minimum: 0}
    MaintenanceJobStatus:
      type: object
      additionalProperties: false
      required: [id, type, state, requestId, updatedAt]
      properties:
        id: {type: string, format: uuid}
        type: {$ref: '#/components/schemas/MaintenanceJobType'}
        state: {$ref: '#/components/schemas/MaintenanceState'}
        requestId: {type: string}
        updatedAt: {type: string, format: date-time}
        code: {type: string, pattern: '^[A-Z][A-Z0-9_]{0,63}$'}
        rolledBack: {type: boolean}
        expiresAt: {type: integer, format: int64}
        backupCreatedAt: {type: string, format: date-time}
        postgresMajor: {type: integer, minimum: 1, maximum: 999}
        database: {type: string, pattern: '^[A-Za-z_][A-Za-z0-9_]*$'}
        preview: {$ref: '#/components/schemas/RestorePreview'}

    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, database]
      properties:
        status: {type: string, enum: [ok]}
        database: {type: string, enum: [ok]}

    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 12, maxLength: 128}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 128}
        newPassword: {type: string, minLength: 12, maxLength: 128}
    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 12, maxLength: 128}
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [expiresInHours]
      properties:
        expiresInHours: {type: integer, minimum: 1, maximum: 168, default: 24}
    InvitationStatusResponse:
      type: object
      additionalProperties: false
      required: [status, expiresAt]
      properties:
        status: {type: string, enum: [valid, used, expired]}
        expiresAt: {type: [string, 'null'], format: date-time}
    CreateInvitationResponse:
      type: object
      additionalProperties: false
      required: [id, inviteUrl, expiresAt]
      properties:
        id: {type: string, format: uuid}
        inviteUrl:
          type: string
          format: uri
          description: 与请求同源的公开注册链接，路径为 /invite/{token}，部署在子路径时包含 /fitgrid 前缀。
        expiresAt: {type: string, format: date-time}

    UserResponse:
      type: object
      additionalProperties: false
      required: [id, username, role, status, createdAt]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        role: {$ref: '#/components/schemas/UserRole'}
        status: {$ref: '#/components/schemas/UserStatus'}
        createdAt: {type: string, format: date-time}
    SessionResponse:
      type: object
      additionalProperties: false
      required: [user, expiresAt]
      properties:
        user: {$ref: '#/components/schemas/UserResponse'}
        expiresAt: {type: string, format: date-time}
    UserPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/UserResponse'}}
        nextCursor: {type: [string, 'null']}

    GridTradeCreateRequest:
      $ref: '#/components/schemas/GridTradeMutationInput'
    GridTradeUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedUpdatedAt]
      properties:
        expectedUpdatedAt: {type: string, format: date-time}
        productName: {type: [string, 'null'], maxLength: 120}
        productCode: {type: string, minLength: 1, maxLength: 64}
        maxPrice: {$ref: '#/components/schemas/PositiveDecimalString'}
        minTradeQuantity: {$ref: '#/components/schemas/PositiveDecimalString'}
        gearAmplitude: {$ref: '#/components/schemas/PositiveDecimalString'}
        perShare: {$ref: '#/components/schemas/PositiveDecimalString'}
        keepShare: {type: integer, minimum: 0}
        increaseAmplitude: {type: integer, minimum: 0}
        mediumAmplitude: {type: [integer, 'null'], minimum: 1}
        bigAmplitude: {type: [integer, 'null'], minimum: 1}
        maxAmplitude: {type: integer, minimum: 1, maximum: 100}
        isShort: {type: boolean}
        category: {type: [string, 'null'], maxLength: 120}
        sortOrder: {type: integer}
    GridTradeMutationInput:
      type: object
      additionalProperties: false
      required:
        - productCode
        - maxPrice
        - minTradeQuantity
        - gearAmplitude
        - perShare
        - keepShare
        - increaseAmplitude
        - maxAmplitude
        - isShort
      properties:
        productName: {type: [string, 'null'], maxLength: 120, default: null}
        productCode: {type: string, minLength: 1, maxLength: 64}
        maxPrice: {$ref: '#/components/schemas/PositiveDecimalString'}
        minTradeQuantity: {$ref: '#/components/schemas/PositiveDecimalString'}
        gearAmplitude: {$ref: '#/components/schemas/PositiveDecimalString'}
        perShare: {$ref: '#/components/schemas/PositiveDecimalString'}
        keepShare: {type: integer, minimum: 0}
        increaseAmplitude: {type: integer, minimum: 0}
        mediumAmplitude: {type: [integer, 'null'], minimum: 1, default: null}
        bigAmplitude: {type: [integer, 'null'], minimum: 1, default: null}
        maxAmplitude: {type: integer, minimum: 1, maximum: 100}
        isShort: {type: boolean}
        category: {type: [string, 'null'], maxLength: 120, default: null}
        sortOrder: {type: integer, default: 0}

    GridTradeSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - productName
        - productCode
        - maxPrice
        - perShare
        - isShort
        - algorithmVersion
        - createdAt
        - updatedAt
      properties:
        id: {type: string, format: uuid}
        productName: {type: [string, 'null']}
        productCode: {type: string}
        maxPrice: {$ref: '#/components/schemas/DecimalString'}
        perShare: {$ref: '#/components/schemas/DecimalString'}
        isShort: {type: boolean}
        algorithmVersion: {$ref: '#/components/schemas/AlgorithmVersion'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    GridTradePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GridTradeSummary'}}
        nextCursor: {type: [string, 'null']}
    GridTradeDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - productName
        - productCode
        - maxPrice
        - perShare
        - isShort
        - algorithmVersion
        - createdAt
        - updatedAt
        - input
        - calculation
      properties:
        id: {type: string, format: uuid}
        productName: {type: [string, 'null']}
        productCode: {type: string}
        maxPrice: {$ref: '#/components/schemas/DecimalString'}
        perShare: {$ref: '#/components/schemas/DecimalString'}
        isShort: {type: boolean}
        algorithmVersion: {$ref: '#/components/schemas/AlgorithmVersion'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        input: {$ref: '#/components/schemas/GridTradeStoredInput'}
        calculation: {$ref: '#/components/schemas/GridCalculation'}
    GridTradeStoredInput:
      type: object
      additionalProperties: false
      required:
        - productCode
        - maxPrice
        - minTradeQuantity
        - gearAmplitude
        - perShare
        - keepShare
        - increaseAmplitude
        - maxAmplitude
        - isShort
        - sortOrder
        - algorithmVersion
      properties:
        productName: {type: [string, 'null'], maxLength: 120, default: null}
        productCode: {type: string, minLength: 1, maxLength: 64}
        maxPrice: {$ref: '#/components/schemas/PositiveDecimalString'}
        minTradeQuantity: {$ref: '#/components/schemas/PositiveDecimalString'}
        gearAmplitude: {$ref: '#/components/schemas/PositiveDecimalString'}
        perShare: {$ref: '#/components/schemas/PositiveDecimalString'}
        keepShare: {type: integer, minimum: 0}
        increaseAmplitude: {type: integer, minimum: 0}
        mediumAmplitude: {type: [integer, 'null'], minimum: 1, default: null}
        bigAmplitude: {type: [integer, 'null'], minimum: 1, default: null}
        maxAmplitude: {type: integer, minimum: 1, maximum: 100}
        isShort: {type: boolean}
        category: {type: [string, 'null'], maxLength: 120, default: null}
        sortOrder: {type: integer, default: 0}
        algorithmVersion: {$ref: '#/components/schemas/AlgorithmVersion'}
    GridCalculation:
      type: object
      additionalProperties: false
      required: [items, totalBuyAmount, totalProfitAmount, totalProfitRate]
      properties:
        items: {type: array, maxItems: 10000, items: {$ref: '#/components/schemas/GridItem'}}
        totalBuyAmount: {$ref: '#/components/schemas/DecimalString'}
        totalProfitAmount: {$ref: '#/components/schemas/DecimalString'}
        totalProfitRate: {$ref: '#/components/schemas/DecimalString'}
    GridItem:
      type: object
      additionalProperties: false
      required:
        - sequence
        - gridType
        - gear
        - buyPrice
        - buyCount
        - buyAmount
        - sellPrice
        - sellCount
        - sellAmount
        - profitAmount
        - profitRate
        - keepProfit
        - keepCount
      properties:
        sequence: {type: integer, minimum: 1}
        gridType: {$ref: '#/components/schemas/GridType'}
        gear: {$ref: '#/components/schemas/DecimalString'}
        buyPrice: {$ref: '#/components/schemas/DecimalString'}
        buyCount: {$ref: '#/components/schemas/DecimalString'}
        buyAmount: {$ref: '#/components/schemas/DecimalString'}
        sellPrice: {$ref: '#/components/schemas/DecimalString'}
        sellCount: {$ref: '#/components/schemas/DecimalString'}
        sellAmount: {$ref: '#/components/schemas/DecimalString'}
        profitAmount: {$ref: '#/components/schemas/DecimalString'}
        profitRate: {$ref: '#/components/schemas/DecimalString'}
        keepProfit: {$ref: '#/components/schemas/DecimalString'}
        keepCount: {$ref: '#/components/schemas/DecimalString'}

    ImportPreviewItem:
      type: object
      additionalProperties: false
      required: [index, productCode]
      properties:
        index: {type: integer, minimum: 0}
        productCode: {type: string}
        warnings: {type: array, items: {type: string}, default: []}
        fieldErrors:
          type: object
          additionalProperties: {type: array, items: {type: string}}
    ImportPreviewResponse:
      type: object
      additionalProperties: false
      required: [previewToken, expiresAt, creates, conflicts, invalid, warnings]
      properties:
        previewToken: {type: string}
        expiresAt: {type: string, format: date-time}
        creates: {type: array, items: {$ref: '#/components/schemas/ImportPreviewItem'}}
        conflicts: {type: array, items: {$ref: '#/components/schemas/ImportPreviewItem'}}
        invalid: {type: array, items: {$ref: '#/components/schemas/ImportPreviewItem'}}
        warnings: {type: array, items: {type: string}}
    ImportCommitRequest:
      type: object
      additionalProperties: false
      required: [previewToken, conflictPolicy]
      properties:
        previewToken: {type: string}
        conflictPolicy: {type: string, enum: [skip, overwrite]}
    ImportCommitResponse:
      type: object
      additionalProperties: false
      required: [created, overwritten, skipped, invalid]
      properties:
        created: {type: integer, minimum: 0}
        overwritten: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        invalid: {type: integer, minimum: 0}

    AndroidGridTrade:
      type: object
      description: Android Gson 兼容导出对象；数值使用 JSON number。导入的宽松历史兼容规则以独立 JSON Schema 为准。
      additionalProperties: false
      required:
        - productCode
        - maxPrice
        - perShare
        - gearAmplitude
        - keepShare
        - increaseAmplitude
        - maxAmplitude
        - minTradeQuantity
        - sortOrder
        - totalBuyAmount
        - totalProfitAmount
        - totalProfitRate
        - gridItems
        - isShort
      properties:
        productName: {type: [string, 'null'], maxLength: 120}
        productCode: {type: string}
        maxPrice: {type: number}
        perShare: {type: number}
        gearAmplitude: {type: number}
        keepShare: {type: integer}
        increaseAmplitude: {type: integer}
        mediumAmplitude: {type: [integer, 'null']}
        bigAmplitude: {type: [integer, 'null']}
        maxAmplitude: {type: integer}
        minTradeQuantity: {type: number}
        category: {type: [string, 'null'], maxLength: 120}
        sortOrder: {type: integer}
        totalBuyAmount: {type: number}
        totalProfitAmount: {type: number}
        totalProfitRate: {type: number}
        gridItems:
          type: array
          maxItems: 10000
          items: {$ref: '#/components/schemas/AndroidGridItem'}
        isShort: {type: boolean}
    AndroidGridItem:
      type: object
      additionalProperties: false
      required:
        - sequence
        - gridType
        - gear
        - buyPrice
        - buyCount
        - buyAmount
        - sellPrice
        - sellCount
        - sellAmount
        - profitAmount
        - profitRate
        - keepProfit
        - keepCount
      properties:
        sequence: {type: integer, minimum: 1}
        gridType: {$ref: '#/components/schemas/GridType'}
        gear: {type: number}
        buyPrice: {type: number}
        buyCount: {type: number}
        buyAmount: {type: number}
        sellPrice: {type: number}
        sellCount: {type: number}
        sellAmount: {type: number}
        profitAmount: {type: number}
        profitRate: {type: number}
        keepProfit: {type: number}
        keepCount: {type: number}
    WebBackup:
      type: object
      additionalProperties: false
      required: [format, formatVersion, exportedAt, ownerRef, products]
      properties:
        format: {type: string, const: fitgridweb-backup}
        formatVersion: {type: string, const: 1.0.0}
        exportedAt: {type: string, format: date-time}
        ownerRef: {type: string, pattern: '^hmac-sha256:[0-9a-f]{64}$'}
        products:
          type: array
          maxItems: 5000
          items: {$ref: '#/components/schemas/WebBackupProduct'}
    WebBackupProduct:
      type: object
      additionalProperties: false
      required:
        - exportId
        - productCode
        - maxPrice
        - minTradeQuantity
        - gearAmplitude
        - perShare
        - keepShare
        - increaseAmplitude
        - maxAmplitude
        - isShort
        - sortOrder
        - algorithmVersion
        - createdAt
        - updatedAt
      properties:
        exportId: {type: string, format: uuid}
        productName: {type: [string, 'null'], maxLength: 120}
        productCode: {type: string, minLength: 1, maxLength: 64}
        maxPrice: {$ref: '#/components/schemas/PositiveDecimalString'}
        minTradeQuantity: {$ref: '#/components/schemas/PositiveDecimalString'}
        gearAmplitude: {$ref: '#/components/schemas/PositiveDecimalString'}
        perShare: {$ref: '#/components/schemas/PositiveDecimalString'}
        keepShare: {type: integer, minimum: 0}
        increaseAmplitude: {type: integer, minimum: 0}
        mediumAmplitude: {type: [integer, 'null'], minimum: 1}
        bigAmplitude: {type: [integer, 'null'], minimum: 1}
        maxAmplitude: {type: integer, minimum: 1, maximum: 100}
        isShort: {type: boolean}
        category: {type: [string, 'null'], maxLength: 120}
        sortOrder: {type: integer}
        algorithmVersion: {$ref: '#/components/schemas/AlgorithmVersion'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
