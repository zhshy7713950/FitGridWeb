openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: FitGridWeb API
  version: 1.0.0
  description: >-
    FitGridWeb 网格交易与股价预警 API。所有产品接口自动限定为当前登录账号；API 不接受或返回 ownerId。
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: System
    description: 服务存活与就绪检查
  - name: Auth
    description: 登录、会话与密码管理
  - name: Invitations
    description: 私有一次性邀请
  - name: Admin
    description: 账号、邀请和禁用状态管理，不读取用户产品
  - name: GridTrades
    description: 当前登录账号的网格产品与权威计算
  - name: ImportExport
    description: 当前登录账号的数据导入、兼容导出与完整备份
  - name: PriceAlerts
    description: 当前账号的股价与动态日均线预警、缓存状态和历史
  - name: Market
    description: 股票与 ETF 标的核对
  - name: Notifications
    description: 当前账号的 Bark 通道与测试

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: 检查服务是否就绪
      security: []
      responses:
        '200':
          description: 应用和数据库就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 使用用户名和密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并设置安全会话 Cookie
          headers:
            Set-Cookie:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 撤销当前会话
      responses:
        '204': {description: 当前会话已撤销}
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/session:
    get:
      tags: [Auth]
      operationId: getSession
      summary: 获取当前会话
      responses:
        '200':
          description: 当前会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 修改当前账号密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204': {description: 密码已更新，其他会话已撤销}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    get:
      tags: [Invitations]
      operationId: getInvitationStatus
      summary: 查询邀请是否可用
      security: []
      responses:
        '200':
          description: 邀请状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/InvitationToken'
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: 接受邀请并创建账号
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '201':
          description: 用户已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/invitations:
    post:
      tags: [Admin, Invitations]
      operationId: createInvitation
      summary: 创建一次性邀请
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: 邀请已创建；明文 token 只返回一次
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateInvitationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: 列出账号及状态
      description: 只返回账号与状态，不返回产品数量或产品数据。
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 账号列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      tags: [Admin]
      operationId: updateUserStatus
      summary: 启用或禁用账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: {$ref: '#/components/schemas/UserStatus'}
      responses:
        '200':
          description: 状态已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /admin/backups:
    get:
      tags: [Admin, ImportExport]
      operationId: listPortableBackups
      summary: 列出最近五份可下载的完整备份
      responses:
        '200':
          description: 按创建时间倒序排列的成功备份，最多五份
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortableBackupList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [Admin, ImportExport]
      operationId: createPortableBackup
      summary: 重新验证管理员并创建完整便携备份
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePortableBackupRequest'}
      responses:
        '202':
          description: 备份任务已进入主机维护队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/backups/{backupId}/download-token:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    post:
      tags: [Admin, ImportExport]
      operationId: issuePortableBackupDownloadToken
      summary: 为一份备份发放绑定管理员的单次下载令牌
      responses:
        '201':
          description: 令牌已发放，60 秒后失效
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadTokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/backups/{backupId}/download:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    get:
      tags: [Admin, ImportExport]
      operationId: downloadPortableBackup
      summary: 使用单次令牌流式下载完整便携备份
      description: 不支持 Range；令牌在打开备份文件前被原子消费，下载中断不会删除服务器副本。
      parameters:
        - name: token
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 4096}
      responses:
        '200':
          description: 加密的便携备份流
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            Content-Disposition:
              description: 固定格式安全文件名的附件响应
              schema: {type: string}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
            Accept-Ranges:
              schema: {type: string, const: none}
          content:
            application/vnd.fitgrid.backup:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '416':
          description: RANGE_NOT_SUPPORTED：完整备份不支持分段下载
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/restores/uploads:
    post:
      tags: [Admin, ImportExport]
      operationId: uploadPortableBackupForInspection
      summary: 流式上传完整备份并创建隔离预检任务
      description: 请求正文直接流式落盘；不使用 multipart/form-data，也不会整体读入 JavaScript 内存。
      parameters:
        - name: fileName
          in: query
          required: true
          schema:
            type: string
            pattern: '^fitgridweb-[0-9]{8}T[0-9]{6}Z\.fitgridbackup$'
        - name: X-FitGrid-Backup-Passphrase
          in: header
          required: true
          description: 独立备份密码的无填充 UTF-8 base64url 信封；解码后必须是 12–128 个 Unicode 码点，且不含 NUL 或换行。密码只在当前 HTTPS 请求内存和受限任务秘密文件中短暂存在
          schema:
            type: string
            minLength: 16
            maxLength: 683
            pattern: '^[A-Za-z0-9_-]+$'
            writeOnly: true
        - name: X-FitGrid-Backup-Passphrase-Encoding
          in: header
          required: true
          description: 明确声明备份密码信封编码；服务端不对缺失或其他值做兼容降级
          schema: {type: string, const: base64url-utf8}
        - name: X-FitGrid-Backup-Size
          in: header
          required: true
          description: 声明的正文大小；部署通过 PORTABLE_BACKUP_MAX_BYTES 配置上限，默认 512 MiB，应用仍会独立统计实际字节数
          schema: {type: integer, minimum: 1, default: 536870912}
      requestBody:
        required: true
        content:
          application/vnd.fitgrid.backup:
            schema: {type: string, format: binary}
      responses:
        '202':
          description: 上传已完整落盘，预检任务已进入队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415':
          description: BACKUP_MEDIA_TYPE_INVALID：必须使用完整备份媒体类型
          content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/restores/{restoreId}/confirm:
    parameters:
      - $ref: '#/components/parameters/RestoreId'
    post:
      tags: [Admin, ImportExport]
      operationId: confirmPortableBackupRestore
      summary: 重新验证管理员并确认整库恢复
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmRestoreRequest'}
      responses:
        '202':
          description: 绑定预检结果的恢复任务已进入队列
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueuedMaintenanceJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /admin/maintenance/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/MaintenanceJobId'
    get:
      tags: [Admin]
      operationId: getMaintenanceJob
      summary: 获取安全裁剪后的维护任务状态
      description: 恢复期间仍可读取；响应不包含宿主机路径、命令、密码或数据库连接信息。
      responses:
        '200':
          description: 当前任务阶段和安全结果
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
            X-Content-Type-Options: {$ref: '#/components/headers/NoSniff'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MaintenanceJobStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}

  /grid-trades:
    get:
      tags: [GridTrades]
      operationId: listGridTrades
      summary: 搜索和分页列出自己的产品
      description: 仅查询当前会话 ownerId 的产品。
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
          description: 产品名称或产品代码模糊搜索
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 当前账号产品页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [GridTrades]
      operationId: createGridTrade
      summary: 创建自己的网格产品
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridTradeCreateRequest'
      responses:
        '201':
          description: 产品已创建并计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /grid-trades/{id}:
    parameters:
      - $ref: '#/components/parameters/GridTradeId'
    get:
      tags: [GridTrades]
      operationId: getGridTrade
      summary: 获取自己的产品和计算结果
      description: 不存在或属于其他账号时均返回 404。
      responses:
        '200':
          description: 产品输入与权威计算结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [GridTrades]
      operationId: updateGridTrade
      summary: 更新自己的产品并重算
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridTradeUpdateRequest'
      responses:
        '200':
          description: 产品已更新并重算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [GridTrades]
      operationId: deleteGridTrade
      summary: 删除自己的产品
      responses:
        '204': {description: 产品已删除}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /grid-trades/{id}/recalculate:
    parameters:
      - $ref: '#/components/parameters/GridTradeId'
    post:
      tags: [GridTrades]
      operationId: recalculateGridTrade
      summary: 重新计算自己的产品
      responses:
        '200':
          description: 使用记录保存的算法版本重新计算
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridTradeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /grid-trades/import/preview:
    post:
      tags: [ImportExport]
      operationId: previewGridTradeImport
      summary: 预检 Android JSON 导入
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 当前账号范围内的导入预检
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportPreviewResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grid-trades/import/commit:
    post:
      tags: [ImportExport]
      operationId: commitGridTradeImport
      summary: 按冲突策略提交导入
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportCommitRequest'
      responses:
        '200':
          description: 事务导入结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportCommitResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
          description: IMPORT_PREVIEW_NOT_FOUND：导入预检不存在、已过期或已使用
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  /grid-trades/export:
    get:
      tags: [ImportExport]
      operationId: exportGridTrades
      summary: 导出自己的网格产品
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [android, web]
      responses:
        '200':
          description: 当前账号的下载文件
          headers:
            Content-Disposition:
              schema: {type: string}
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: {$ref: '#/components/schemas/AndroidGridTrade'}
                  - $ref: '#/components/schemas/WebBackup'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /price-alerts:
    get:
      tags: [PriceAlerts]
      operationId: listPriceAlerts
      summary: 列出当前账号的预警与采集状态
      description: 最多返回 250 条未删除规则；只读取缓存与持久状态，不因刷新请求行情。
      responses:
        '200':
          description: 规则及交易日历、下一次任务、最近采集状态
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertPage'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    post:
      tags: [PriceAlerts]
      operationId: createPriceAlert
      summary: 创建当前账号的预警
      description: >-
        需同源 Origin 和会话 Cookie。JSON 请求体最多 16 KiB。instrumentId 须先核对解析；
        enabled 必填，客户端新建规则应显式传 false。启用规则前必须成功测试 Bark 通道。
        均线规则保存前验证 N−1 个有效复权日线；确认不足返回 HISTORY_INSUFFICIENT 并提示可用数量/最大周期，无法验证返回 HISTORY_UNAVAILABLE。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertCreateRequest'}}}
      responses:
        '201':
          description: 规则已创建
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlert'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '409':
          $ref: '#/components/responses/Conflict'
          description: CHANNEL_NOT_READY 或 ALERT_CAPACITY（当前账号最多 250 条未删除预警）
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          $ref: '#/components/responses/ValidationError'
          description: VALIDATION_FAILED、OWNER_FIELD_FORBIDDEN、INSTRUMENT_INVALID 或 HISTORY_INSUFFICIENT
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /price-alerts/{id}:
    parameters:
      - $ref: '#/components/parameters/PriceAlertId'
    get:
      tags: [PriceAlerts]
      operationId: getPriceAlert
      summary: 获取当前账号的预警详情
      description: 跨账号或不存在的规则返回 ALERT_NOT_FOUND，不触发行情请求。
      responses:
        '200':
          description: 规则及已保存的标的信息、最近判定
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlert'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    patch:
      tags: [PriceAlerts]
      operationId: updatePriceAlert
      summary: 按版本编辑、暂停或启用预警
      description: >-
        需同源 Origin；JSON 最多 16 KiB。expectedVersion 必须匹配当前 version，且至少提供 condition 或 enabled。
        更新递增版本、清空判定游标并重设激活起点，取消旧版本待发送任务；不可修改 instrumentId。
        修改均线条件或重新启用时先验证历史日线；确认不足返回422 HISTORY_INSUFFICIENT，来源无法验证返回503 HISTORY_UNAVAILABLE。纯暂停不请求日线。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertUpdateRequest'}}}
      responses:
        '200':
          description: 更新后的规则
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlert'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: EDIT_CONFLICT（请重新读取版本）或 CHANNEL_NOT_READY
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      tags: [PriceAlerts]
      operationId: deletePriceAlert
      summary: 按版本软删除预警并取消待发送任务
      description: 需同源 Origin；JSON 最多 16 KiB，必须在请求体提供 expectedVersion，不能放入查询参数。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertDeleteRequest'}}}
      responses:
        '204': {description: 已停用并软删除，旧版本通知不会继续发送}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          $ref: '#/components/responses/Conflict'
          description: EDIT_CONFLICT，需先重新读取当前版本
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /price-alerts/{id}/events:
    parameters:
      - $ref: '#/components/parameters/PriceAlertId'
    get:
      tags: [PriceAlerts]
      operationId: listPriceAlertEvents
      summary: 分页读取当前账号的预警历史
      description: 按 minuteStart、id 均降序，每页最多 50 条。只读取持久历史，不请求行情或重发通知。
      parameters:
        - name: before
          in: query
          description: >-
            原样使用上一页 nextCursor；这是最多 512 字符的不透明 base64url 编码复合游标，
            内部为 minuteStart（UTC 时间）及 id，不是裸 ISO 时间。不要自行构造或修改；空值等同未提供。
          schema: {$ref: '#/components/schemas/AlertEventCursor'}
      responses:
        '200':
          description: 历史事件和下一页游标；nextCursor 为 null 时已到末页
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/PriceAlertEventPage'}}}
        '400':
          $ref: '#/components/responses/BadRequest'
          description: CURSOR_INVALID，非有效复合分页游标
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422':
          $ref: '#/components/responses/ValidationError'
          description: before 超过 512 字符、id 无效或包含未知查询参数
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /market/instruments/resolve:
    post:
      tags: [Market]
      operationId: resolveMarketInstrument
      summary: 核对沪深或美股股票、场内 ETF 标的
      description: >-
        需同源 Origin；JSON 最多 16 KiB。核对远程提供方后保存规范代码，返回的 id 用于创建规则。
        沪深代码例如 510300.SH，美股例如 SPY 或 SPY.US；仅支持 CN/CNY 与 US/USD 股票和 ETF。
        每账号核对限流 10 次/分钟，同时受账号通用写入限流约束。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/MarketInstrumentResolveRequest'}}}
      responses:
        '200':
          description: 已核对并保存的标的
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/MarketInstrument'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422':
          $ref: '#/components/responses/ValidationError'
          description: VALIDATION_FAILED 或 INSTRUMENT_UNAVAILABLE，代码不支持或无法核对
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /settings/notifications:
    get:
      tags: [Notifications]
      operationId: getNotificationChannel
      summary: 获取当前账号的 Bark 配置状态
      description: 仅返回是否配置、是否通过测试及错误状态，永不返回设备 Key 或加密密文。
      responses:
        '200':
          description: 当前账号通道状态
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelStatus'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      tags: [Notifications]
      operationId: saveNotificationChannel
      summary: 保存或更换当前账号的 Bark 设备 Key
      description: >-
        需同源 Origin；JSON 最多 16 KiB。设备 Key 加密保存，响应仅含状态。
        保存或更换会暂停本账号已启用规则、取消待发送任务并清除测试状态，必须重新测试并主动启用规则。
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelRequest'}}}
      responses:
        '200':
          description: 保存后的通道状态
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationChannelStatus'}}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: 维护中或 NOTIFICATION_NOT_CONFIGURED，服务器加密密钥未就绪
    delete:
      tags: [Notifications]
      operationId: deleteNotificationChannel
      summary: 删除当前账号的 Bark 通道
      description: 需同源 Origin；暂停本账号已启用规则并取消待发送任务，无请求体。
      responses:
        '204': {description: 通道已删除，相关规则保持暂停}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /settings/notifications/test:
    post:
      tags: [Notifications]
      operationId: testNotificationChannel
      summary: 向已保存的 Bark 通道发送测试通知
      description: >-
        需同源 Origin，无请求体，每账号最多 3 次/分钟并受通用写入限流约束。
        accepted 仅表示 Bark 服务已接受，不代表 iPhone 已展示；请在设备确认收到。
        成功更新通道测试时间，之后仍需主动启用规则。
      responses:
        '200':
          description: 测试通知已被 Bark 接受
          headers:
            Cache-Control: {$ref: '#/components/headers/PrivateNoStore'}
          content: {application/json: {schema: {$ref: '#/components/schemas/NotificationTestResponse'}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          $ref: '#/components/responses/Forbidden'
          description: CROSS_SITE_REQUEST，同源 Origin 缺失或不匹配
        '409':
          $ref: '#/components/responses/Conflict'
          description: CHANNEL_NOT_READY，请先保存设备 Key
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
          description: 维护中，或 NOTIFICATION_NOT_CONFIGURED、CHANNEL_UNREADABLE、BARK_REJECTED

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: fitgridweb.session_token

  parameters:
    Cursor:
      name: cursor
      in: query
      schema: {type: string, maxLength: 512}
      description: 服务端签名的不透明游标
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    PriceAlertId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    GridTradeId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
    UserId:
      name: userId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InvitationToken:
      name: token
      in: path
      required: true
      schema: {type: string, minLength: 32, maxLength: 512}
    BackupId:
      name: backupId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9.][A-Za-z0-9._-]*$'
    RestoreId:
      name: restoreId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MaintenanceJobId:
      name: jobId
      in: path
      required: true
      schema: {type: string, format: uuid}

  headers:
    PrivateNoStore:
      description: 响应不得由浏览器或中间缓存保存
      schema: {type: string, const: 'no-store, private'}
    NoSniff:
      description: 禁止浏览器内容类型嗅探
      schema: {type: string, const: nosniff}

  responses:
    BadRequest:
      description: 请求格式错误
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: 未认证或会话失效
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: 当前角色无权执行管理操作
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: 资源不存在；跨账号产品也使用本响应
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: 唯一性、版本或邀请状态冲突
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    PayloadTooLarge:
      description: 文件或请求体超限
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationError:
      description: 字段或算法校验失败
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: 请求过快
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ServiceUnavailable:
      description: 服务未就绪
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    InternalError:
      description: 内部状态不可用；响应经过安全裁剪，不包含路径、命令或秘密
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}

  schemas:
    DecimalString:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
      examples: ['1.05', '2000', '0.1856']
    PositiveDecimalString:
      allOf:
        - $ref: '#/components/schemas/DecimalString'
      description: 解析后的十进制值必须大于 0
    AlertUtcTimestamp:
      type: string
      format: date-time
      pattern: 'Z$'
      description: ISO 8601 UTC 时间，统一以 Z 结尾
    AlertProvider:
      type: string
      enum: [tencent, eastmoney, yahoo]
    AlertPriceInput:
      type: string
      pattern: '^(?:0|[1-9][0-9]{0,19})(?:\.[0-9]{1,10})?$'
      not: {pattern: '^0(?:\.0+)?$'}
      description: 大于 0 的普通十进制字符串，整数最多 20 位、小数最多 10 位，不接受指数形式
      examples: ['100', '0.0000000001']
    AlertPercentInput:
      type: string
      pattern: '^[0-9]{1,2}(?:\.[0-9]{1,2})?$'
      not: {pattern: '^0{1,2}(?:\.0{1,2})?$'}
      description: 0.01–99.99 的十进制百分比字符串，最多两位小数
      examples: ['0.01', '5', '99.99']
    AlertCondition:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, direction, targetPrice]
          properties:
            kind: {const: price}
            direction: {type: string, enum: [up, down]}
            targetPrice: {$ref: '#/components/schemas/AlertPriceInput'}
        - type: object
          additionalProperties: false
          required: [kind, direction, days]
          properties:
            kind: {const: ma_touch}
            direction: {type: string, enum: [up, down]}
            days: {type: integer, minimum: 2, maximum: 500}
        - type: object
          additionalProperties: false
          required: [kind, direction, days, percent]
          properties:
            kind: {const: ma_deviation}
            direction: {type: string, enum: [up, down]}
            days: {type: integer, minimum: 2, maximum: 500}
            percent: {$ref: '#/components/schemas/AlertPercentInput'}
      description: >-
        up 向上、down 向下，等于阈值也触发。均线使用前 N−1 个已完成交易日的同源复权收盘价加候选价动态计算，
        ma_touch 是触及动态日均线，ma_deviation 是达到动态均线上方或下方 percent 百分比。
    MarketInstrumentResolveRequest:
      type: object
      additionalProperties: false
      required: [market, code]
      properties:
        market: {type: string, enum: [cn, us]}
        code: {type: string, minLength: 1, maxLength: 32}
      examples:
        - {market: cn, code: 510300.SH}
        - {market: us, code: SPY}
    MarketInstrument:
      type: object
      additionalProperties: false
      required: [id, code, name, market, currency, kind, tencent, yahoo, eastmoney, quote, createdAt]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, maxLength: 32}
        name: {type: string, maxLength: 160}
        market: {type: string, enum: [cn, us]}
        currency: {type: string, enum: [CNY, USD]}
        kind: {type: string, enum: [stock, etf]}
        tencent: {type: [string, 'null'], maxLength: 32}
        yahoo: {type: [string, 'null'], maxLength: 32}
        eastmoney: {type: [string, 'null'], maxLength: 40}
        quote: {description: 已保存的 JSON 行情快照或 null，不在读取时请求行情}
        createdAt: {$ref: '#/components/schemas/AlertUtcTimestamp'}
    PriceAlertCreateRequest:
      type: object
      additionalProperties: false
      required: [instrumentId, condition, enabled]
      properties:
        instrumentId: {type: string, format: uuid}
        condition: {$ref: '#/components/schemas/AlertCondition'}
        enabled: {type: boolean, description: 新建规则应显式传 false；true 要求通道已测试}
    PriceAlertUpdateRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      minProperties: 2
      properties:
        expectedVersion: {type: integer, minimum: 1}
        condition: {$ref: '#/components/schemas/AlertCondition'}
        enabled: {type: boolean}
    PriceAlertDeleteRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
    AlertEvaluation:
      type: object
      additionalProperties: false
      required: [price, provider, minuteEnd, fetchedAt, ma, threshold, adjustment]
      properties:
        price: {$ref: '#/components/schemas/DecimalString'}
        provider: {$ref: '#/components/schemas/AlertProvider'}
        minuteEnd: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        fetchedAt: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        ma:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - {type: 'null'}
        threshold: {$ref: '#/components/schemas/DecimalString'}
        adjustment: {type: [string, 'null']}
    PriceAlert:
      type: object
      additionalProperties: false
      required: [id, instrumentId, condition, enabled, version, armed, cursor, activeFrom, continuityDegraded, lastError, lastSuccess, lastEvaluation, deletedAt, createdAt, updatedAt, instrument]
      properties:
        id: {type: string, format: uuid}
        instrumentId: {type: string, format: uuid}
        condition: {$ref: '#/components/schemas/AlertCondition'}
        enabled: {type: boolean}
        version: {type: integer, minimum: 1}
        armed: {type: boolean}
        cursor:
          anyOf:
            - $ref: '#/components/schemas/AlertUtcTimestamp'
            - {type: 'null'}
          description: 最近处理的分钟结束时间；这是规则内部状态，不是历史分页游标
        activeFrom: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        continuityDegraded: {type: boolean}
        lastError: {type: [string, 'null'], maxLength: 240}
        lastSuccess:
          anyOf:
            - $ref: '#/components/schemas/AlertUtcTimestamp'
            - {type: 'null'}
        lastEvaluation:
          anyOf:
            - $ref: '#/components/schemas/AlertEvaluation'
            - {type: 'null'}
        deletedAt:
          anyOf:
            - $ref: '#/components/schemas/AlertUtcTimestamp'
            - {type: 'null'}
        createdAt: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        updatedAt: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        instrument: {$ref: '#/components/schemas/MarketInstrument'}
    PriceAlertPage:
      type: object
      additionalProperties: false
      required: [items, status]
      properties:
        items:
          type: array
          maxItems: 250
          items: {$ref: '#/components/schemas/PriceAlert'}
        status:
          type: object
          additionalProperties: false
          required: [calendarWarnings, nextRunAt, lastScan]
          properties:
            calendarWarnings: {type: array, items: {type: string}}
            nextRunAt:
              anyOf:
                - $ref: '#/components/schemas/AlertUtcTimestamp'
                - {type: 'null'}
            lastScan:
              anyOf:
                - type: object
                  additionalProperties: false
                  required: [market, status, windowEnd, finishedAt]
                  properties:
                    market: {type: string, enum: [cn, us]}
                    status: {type: string, maxLength: 16}
                    windowEnd: {$ref: '#/components/schemas/AlertUtcTimestamp'}
                    finishedAt:
                      anyOf:
                        - $ref: '#/components/schemas/AlertUtcTimestamp'
                        - {type: 'null'}
                - {type: 'null'}
    AlertEventCursor:
      type: string
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]*$'
      description: 服务端生成的不透明 base64url 复合游标（minuteStart 与 id）；须原样回传，不是 ISO 时间
    AlertDelivery:
      type: object
      additionalProperties: false
      required: [status, lastError, acceptedAt, attempts]
      properties:
        status: {type: string, enum: [pending, sending, accepted, failed, expired, cancelled, history]}
        lastError: {type: [string, 'null']}
        acceptedAt:
          anyOf:
            - $ref: '#/components/schemas/AlertUtcTimestamp'
            - {type: 'null'}
        attempts: {type: integer, minimum: 0}
      description: accepted 为 Bark 已接受；history 为无发送队列的历史记录。均不证明设备已展示通知
    PriceAlertEvent:
      type: object
      additionalProperties: false
      required: [id, ruleId, version, minuteStart, minuteEnd, price, threshold, ma, provider, evidence, createdAt, delivery]
      properties:
        id: {type: string, format: uuid}
        ruleId: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        minuteStart: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        minuteEnd: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        price: {$ref: '#/components/schemas/DecimalString'}
        threshold: {$ref: '#/components/schemas/DecimalString'}
        ma:
          anyOf:
            - $ref: '#/components/schemas/DecimalString'
            - {type: 'null'}
        provider: {$ref: '#/components/schemas/AlertProvider'}
        evidence:
          description: 保存的 JSON 判定证据，包括条件、复权和提供方、补采及连续性信息；可包含送达状态快照
        createdAt: {$ref: '#/components/schemas/AlertUtcTimestamp'}
        delivery: {$ref: '#/components/schemas/AlertDelivery'}
    PriceAlertEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/PriceAlertEvent'}
        nextCursor:
          anyOf:
            - $ref: '#/components/schemas/AlertEventCursor'
            - {type: 'null'}
    NotificationChannelRequest:
      type: object
      additionalProperties: false
      required: [deviceKey]
      properties:
